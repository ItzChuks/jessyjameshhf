<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="tailwind.css?v=20261109k"><script src="theme.js?v=20261109k"></script><script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.js"></script><script src="mock.js?v=20261109k"></script><script src="pdf.js?v=20261109k"></script><script src="app.js?v=20261109k"></script><title>Dashboard – Jessy James Helping Hands Foundation</title></head>
<body class="bg-slate-50 text-slate-800"><div id="app"></div>
<script>
if (guard()) {
const U = () => pb.authStore.record, uf = () => 'user="' + U().id + '"';
const planOf = s => s.expand?.plan || {};
const subs = () => pb.collection('subscriptions').getFullList({ filter: uf(), expand: 'plan', sort: '-created' });
const pays = () => pb.collection('payments').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' });
// progress counts savings only: late penalties are fees, not savings
const sum = (l, s) => l.filter(p => p.status === 'confirmed' && (!s || p.subscription === s)).reduce((a, p) => a + p.amount - (p.penalty || 0), 0);
const bar = pc => `<div class="h-1.5 bg-slate-100 rounded-full mt-3"><div class="h-1.5 bg-emerald-700 rounded-full" style="width:${pc}%"></div></div>`;
const dueLine = (st, f) => !st.left ? '<span class="text-emerald-800 font-medium">Fully paid</span>'
  : st.overdue ? `<span class="text-red-600 font-medium">${plural(st.overdue, f)} overdue · ${naira(st.overdue * st.A * RULES.lateMultiplier)} due now (includes ${naira(st.overdue * st.pen)} penalty)</span>`
  : `Next payment due <b class="font-medium text-slate-700">${fmtDue(f, st.next)}</b>`;

window.PLAN_ACTION = p => `<button onclick="closePlan();join('${p.id}')" class="${btn} w-full py-2.5">Join this plan</button>`;

// wallet helpers: which of my plans are ready / waiting for a top-up
const waits = (s, p, bal) => s.filter(x => x.status === 'active').map(x => { const pl = planOf(x), st = planState(x, pl, p); return { x, pl, st, w: walletStatus(x, pl, st, bal) }; });
const waitBanner = (ws, bal) => {
  const w = ws.filter(i => i.w.s === 'waiting'); if (!w.length) return '';
  const need = w.reduce((a, i) => a + i.w.cost, 0) - bal;
  return `<div class="mb-6 rounded-xl border bg-red-50 border-red-200 text-red-700 p-4 text-sm flex flex-wrap items-center justify-between gap-3"><p><b>${w.length === 1 ? '1 plan is' : w.length + ' plans are'} waiting for money:</b> ${w.map(i => esc(i.pl.name)).join(', ')}. Deposit at least <b>${naira(need)}</b> into your wallet and ${w.length === 1 ? 'it is' : 'they are'} paid automatically.</p><button onclick="depositBox(${Math.max(100, need)})" class="${btn}">Deposit now</button></div>`;
};

// Joining a plan, once or several times at once (up to MAX_SLOTS running memberships of the same plan). Each time is a separate
// membership with its own joining fee, payments, payout and plan code. An optional plan code applies once, to the first one.
window.join = async id => {
  const pl = (window._pl || []).find(p => p.id === id) || await pb.collection('plans').getOne(id).catch(() => null);
  if (!pl) return toast('That plan could not be found.', 1);
  const [bal, mine, myCodes] = await Promise.all([walletBal(), pb.collection('subscriptions').getList(1, 1, { filter: pb.filter('user = {:u} && plan = {:p} && status = "active"', { u: U().id, p: id }) }).then(r => r.totalItems).catch(() => 0),
    pb.collection('subscriptions').getFullList({ filter: pb.filter('user = {:u} && code != "" && code_used_at = "" && code_admin = ""', { u: U().id }), expand: 'plan', sort: 'code_until' }).then(l => l.filter(x => codeStatus(x) === 'open')).catch(() => [])]);
  const pre = window._useAllCodes; window._useAllCodes = false;          // "Use all my codes" from the overview
  const room = Math.max(0, MAX_SLOTS - mine);
  if (!room) return toast('You already have ' + MAX_SLOTS + ' running memberships of this plan, the most allowed. You can join again when one ends.', 1, 7000);
  const now = new Date().toISOString(), S = sched({ created: now }, pl), c = catchupCount({ created: now }, pl), catchup = c * pl.amount, first = isSeasonal(pl) ? 0 : pl.amount, each = FEES.join + catchup + first;
  const opens = termEnd({ created: now }, pl);
  const row = (k, v, cls = '', vid = '') => `<div class="flex justify-between gap-4 py-2 text-sm ${cls}"><dt class="text-slate-500">${k}</dt><dd ${vid ? `id="${vid}"` : ''} class="font-medium text-slate-900 text-right">${v}</dd></div>`;
  const sbtn = 'w-10 h-10 shrink-0 rounded-lg border bg-white text-lg font-semibold text-slate-700 hover:bg-slate-100';
  modal('Join ' + esc(pl.name),
    `<dl class="divide-y border rounded-lg px-3">${row('Contribution', naira(pl.amount) + ' / ' + FQ[pl.frequency])}${row('Plan length', monthsLabel(pl) + ' · ' + S.n + ' payment' + (S.n === 1 ? '' : 's'))}${row('Total payout', naira(payoutOf(pl)) + ' each')}${row('Payout opens', fmtDay(opens) + ' (' + payoutDays(pl) + ' days)')}${codeDays(pl) ? row('Your plan code', 'usable ' + codeDays(pl)) : ''}</dl>`
    + `<div class="text-sm"><span class="text-slate-600">How many times do you want to join?</span><div class="flex items-center gap-2 mt-1"><button type="button" data-q="-1" class="${sbtn}">−</button><input name="qty" type="number" inputmode="numeric" min="1" max="${room}" step="1" value="1" required class="${inp} text-center font-semibold"><button type="button" data-q="1" class="${sbtn}">+</button></div><p class="text-xs text-slate-500 mt-1">Each one is a separate membership with its own payments, payout and plan code. Up to ${MAX_SLOTS} per plan${mine ? ` (you already have ${mine}, so up to ${room} more)` : ''}.</p></div>`
    + (myCodes.length ? `<div class="text-sm"><div class="flex items-center justify-between gap-3"><span class="text-slate-600">Use your plan codes <span class="text-slate-400">(${myCodes.length} ready)</span></span><label class="flex items-center gap-2 text-xs font-medium text-emerald-800 cursor-pointer"><input type="checkbox" id="jc-all" class="w-4 h-4 rounded accent-emerald-700">Select all</label></div>
      <div class="mt-1 max-h-44 overflow-y-auto border rounded-lg divide-y">${myCodes.map(x => `<label class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-slate-50"><input type="checkbox" data-code="${esc(x.code)}" class="w-4 h-4 rounded accent-emerald-700"><span class="font-mono font-semibold tracking-wider text-slate-900">${esc(x.code)}</span><span class="text-xs text-slate-500 truncate">${esc(x.expand?.plan?.name || '')} · until ${lastDay(x)}</span></label>`).join('')}</div>
      <p id="jc-note" class="text-xs text-slate-500 mt-1">Each new membership uses one code. Tick the codes to use, or Select all; the number of times you join goes up to match.</p></div>` : '')
    + `<label class="block text-sm"><span class="text-slate-600">${myCodes.length ? 'Or enter a code shared with you' : 'Plan code'} <span class="text-slate-400">(optional)</span></span><input name="code" autocomplete="off" placeholder="JJ-XXXX-XXXX" class="${inp} mt-1 font-mono uppercase tracking-wider"></label><p id="cst" class="text-xs text-slate-500 -mt-1">Have a plan code from one of your plans, or one shared with you? Enter it here. A code works once.</p>`
    + `<dl class="divide-y border rounded-lg px-3">${row('Joining fee', naira(FEES.join))}${first ? row('First payment (today)', naira(first)) : ''}${c ? row('Catch-up (' + c + ' × ' + naira(pl.amount) + ')', naira(catchup)) : ''}${row('Per membership', naira(each), '', 'jq-each')}${row('Total from your wallet', naira(each), 'font-semibold', 'jq-total')}${row('Your wallet', naira(bal))}</dl>`
    + '<div id="jq-msg"></div>'
    + '<p class="text-xs text-slate-500">By joining you agree to the <a href="terms.html" target="_blank" class="text-emerald-800 underline">Terms and Conditions</a>.</p>',
    async d => {
      const codes = picked(), q = Math.min(room, Math.max(1, Math.floor(+d.qty || 1), codes.length + ((d.code || '').trim() ? 1 : 0))), total = each * q, short = total - bal;
      if (short > 0) { await startDeposit(short); return; }
      const r = await payFee({ type: 'join', plan: id, qty: q, code: (d.code || '').trim(), codes });
      toast((q > 1 ? 'Joined ' + q + ' times' : 'Plan joined') + (r.codesUsed ? ' using ' + (r.codesUsed === 1 ? '1 code' : r.codesUsed + ' codes') : '') + '. The joining fee' + (q > 1 ? 's' : '') + (first ? ' and first payment' + (q > 1 ? 's were' : ' were') : (q > 1 ? ' were' : ' was')) + ' taken from your wallet.', 0, 6000);
      location.hash = 'mine';
    },
    'Pay ' + naira(each) + ' and join');
  // live totals as the number changes
  const M = document.querySelector('[data-ui="modal"]'), qi = M.querySelector('[name="qty"]'), sub = M.querySelector('button:not([type])');
  const boxes = [...M.querySelectorAll('[data-code]')], all = M.querySelector('#jc-all');
  const picked = () => boxes.filter(b => b.checked).map(b => b.dataset.code);
  // ticking codes raises the number of times to join so every ticked code gets its own membership
  const syncQty = () => { const k = picked().length; if (all) { all.checked = k === boxes.length; all.indeterminate = k > 0 && k < boxes.length; } if (k > +qi.value) qi.value = Math.min(room, k); if (k > room) { toast('You can join this plan ' + room + ' more time' + (room === 1 ? '' : 's') + ', so only ' + room + ' code' + (room === 1 ? '' : 's') + ' can be used here.', 1, 6000); boxes.filter(b => b.checked).slice(room).forEach(b => b.checked = false); } paint(); };
  boxes.forEach(b => b.onchange = syncQty);
  if (all) all.onchange = () => { boxes.forEach((b, i) => b.checked = all.checked && i < room); syncQty(); };
  const paint = () => {
    const q = Math.min(room, Math.max(1, Math.floor(+qi.value || 1), picked().length)), total = each * q, short = total - bal;
    if (+qi.value !== q && document.activeElement !== qi) qi.value = q;
    const k = picked().length; if ($('#jc-note')) $('#jc-note').innerHTML = k ? `<b class="text-emerald-800">${k} code${k === 1 ? '' : 's'} selected</b>, used on ${k === q ? (k === 1 ? 'your new membership' : 'all ' + q + ' new memberships') : k + ' of your ' + q + ' new memberships'}.` : 'Each new membership uses one code. Tick the codes to use, or Select all; the number of times you join goes up to match.';
    $('#jq-each').textContent = naira(each) + (q > 1 ? ' × ' + q : '');
    $('#jq-total').textContent = naira(total);
    $('#jq-msg').innerHTML = short > 0
      ? `<div class="rounded-lg border bg-red-50 border-red-200 text-red-700 p-3 text-sm">Your wallet is short by <b>${naira(short)}</b>. Deposit it first: you pay <b>${naira(short + FEES.tax)}</b> (includes the ${naira(FEES.tax)} tax charge), then come back to join.</div>`
      : `<div class="rounded-lg border bg-emerald-50 border-emerald-200 text-emerald-800 p-3 text-sm">After joining, your wallet will hold <b>${naira(bal - total)}</b>. ${S.n > 1 ? `Your next payment${q > 1 ? 's' : ''} (${naira(pl.amount * q)}) ${q > 1 ? 'are' : 'is'} taken automatically on <b>${fmtDay(collectAt({ created: now }, pl, 1))}</b>, then every ${pl.frequency === 'daily' ? 'day' : '7 days'}.` : ''}</div>`;
    sub.textContent = short > 0 ? 'Deposit ' + naira(short + FEES.tax) : 'Pay ' + naira(total) + ' and join' + (q > 1 ? ' ×' + q : '');
    const hide = short > 0; M.querySelector('[name="code"]').closest('label').classList.toggle('hidden', hide); $('#cst').classList.toggle('hidden', hide);
  };
  M.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { qi.value = Math.min(room, Math.max(1, picked().length, (Math.floor(+qi.value) || 1) + +b.dataset.q)); paint(); });
  qi.oninput = paint; qi.onblur = () => { qi.value = Math.min(room, Math.max(1, picked().length, Math.floor(+qi.value || 1))); paint(); };
  if (pre && all) { all.checked = true; all.onchange(); } else paint();
  // live check of the code as it is typed
  const ci = M.querySelector('[name="code"]'), cst = $('#cst'); let ct;
  ci.oninput = () => {
    clearTimeout(ct); const v = ci.value.trim();
    if (!v) { cst.className = 'text-xs text-slate-500 -mt-1'; cst.textContent = 'Have a plan code from one of your plans, or one shared with you? Enter it here. A code works once.'; return; }
    ct = setTimeout(async () => {
      try { const r = await pb.send('/api/jjhhf/code/check', { method: 'POST', body: { code: v } }); if (ci.value.trim() !== v) return;
        cst.className = 'text-xs -mt-1 font-medium ' + (r.status === 'valid' ? 'text-emerald-800' : 'text-red-600'); cst.textContent = r.message + (r.plan && r.status === 'valid' ? ' (from a ' + r.plan + ' plan)' : ''); }
      catch (x) { cst.className = 'text-xs -mt-1 text-red-600'; cst.textContent = x.message; }
    }, 400);
  };
};

// Requesting a payout. Three things are checked first (the server enforces them as well):
//   1) another plan must be actively running, 2) the one-time ₦5,000 t-shirt fee must be paid, 3) then the ₦3,500 clearance fee is taken from the wallet (once per plan).
window.payout = async sid => {
  let list, bal; try { [list, bal] = await Promise.all([subs(), walletBal()]); } catch (x) { return toast(x.message, 1); }
  const cleared = !!(list.find(s => s.id === sid) || {}).clearance_paid_at;   // the clearance fee is paid once per plan
  if (!runningOthers(list, sid, planOf).length) return toast(PAYOUT_NEEDS_PLAN, 1, 7000);
  const bar2 = need => bal < need ? `<div class="rounded-lg border bg-red-50 border-red-200 text-red-700 p-3 text-sm">Your wallet has ${naira(bal)}. Deposit at least <b>${naira(need - bal)}</b> first (you pay ${naira(need - bal + FEES.tax)} with the tax charge).</div>` : `<p class="text-xs text-slate-500">Your wallet: ${naira(bal)}</p>`;
  if (!U().shirt_paid) return modal('Pay the t-shirt fee first',
    `<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-800 p-3 text-sm">Before your first payout you pay the one-time <b>${naira(FEES.shirt)}</b> t-shirt fee, taken from your wallet. You pay it once only, and only now because you are requesting a payout.</div>${bar2(FEES.shirt)}<p class="text-sm text-slate-600">When it is paid you will be a registered member. Then come back to <b>My contributions</b> and request this payout (a ${naira(FEES.clearance)} clearance fee applies to the request).</p>`,
    async () => { if (bal < FEES.shirt) { await startDeposit(FEES.shirt - bal); return; } await payFee({ type: 'shirt' }); await pb.collection('users').authRefresh().catch(() => { }); toast('T-shirt fee paid. You can now request your payout.'); },
    bal < FEES.shirt ? 'Deposit ' + naira(FEES.shirt - bal + FEES.tax) + '' : 'Pay ' + naira(FEES.shirt) + ' from wallet');
  const me = await pb.collection('users').getOne(U().id).catch(() => U());
  if (!payoutReady(me)) return modal('Add your payout details first',
    `<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-800 p-3 text-sm">Payouts are paid into the bank account on your <b>Profile</b>. Add your account name, bank, 10-digit account number and address there, then come back to request this payout.</div>`,
    async () => { location.hash = 'profile'; }, 'Go to Profile');
  modal('Request payout',
    `<p class="text-sm text-slate-600">Your payout will be paid to:</p><div class="rounded-lg border bg-slate-50 px-3 py-1">${payoutDetails(me)}</div><p class="text-xs text-slate-500">Not right? <a href="#profile" onclick="this.closest('[data-ui]').remove()" class="text-emerald-800 underline font-medium">Edit your Profile</a> first.</p>`
    + (cleared
      ? `<div class="rounded-lg border bg-emerald-50 border-emerald-200 text-emerald-800 p-3 text-sm">The <b>${naira(FEES.clearance)}</b> clearance fee for this plan is already paid, so nothing more is taken from your wallet.</div>`
      : `<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-800 p-3 text-sm">A clearance fee of <b>${naira(FEES.clearance)}</b> must be paid for this plan before its payout can be requested. It is taken from your wallet once, and your request is sent to the admin as soon as it is paid.</div>${bar2(FEES.clearance)}`),
    async () => { if (!cleared && bal < FEES.clearance) { await startDeposit(FEES.clearance - bal); return; } await payFee({ type: 'clearance', subscription: sid }); toast('Payout requested'); },
    cleared ? 'Request payout' : bal < FEES.clearance ? 'Deposit ' + naira(FEES.clearance - bal + FEES.tax) + '' : 'Pay ' + naira(FEES.clearance) + ' and request payout');
};

const KIND = { topup: 'Deposit', contribution: 'Contribution', join: 'Joining fee', catchup: 'Catch-up', shirt: 'T-shirt fee', clearance: 'Clearance fee', reversal: 'Deposit reversed' };
const txRows = l => l.map(x => [date(x.created) + ' <span class="text-slate-400 text-xs">' + new Date(parseTs(x.created)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>', KIND[x.kind] || x.kind, `<span class="text-xs text-slate-500">${esc(x.note || '')}</span>`, `<span class="font-medium ${x.type === 'credit' ? 'text-emerald-800' : 'text-slate-800'}">${x.type === 'credit' ? '+' : '−'}${naira(x.amount)}</span>`, naira(x.balance)]);

const startApp = () => layout({ brand: BRAND_SHORT, nav: [['overview', 'Overview'], ['wallet', 'Wallet'], ['plans', 'Browse plans'], ['mine', 'My contributions'], ['payments', 'Transaction history'], ['fees', 'Fees paid'], ['payouts', 'Payouts'], ['rules', 'Rules and fees'], ['profile', 'Profile']], views: {
  async overview(m) {
    const [s, p, bal] = await Promise.all([subs(), pays(), walletBal()]), act = s.filter(x => x.status === 'active');
    m.innerHTML = head('Welcome back, ' + esc((U().name || 'there').split(' ')[0]), 'Your wallet and your savings at a glance.', `<a href="#plans" class="${btn}">Browse plans</a>`)
      + (U().role !== 'admin' && !U().shirt_paid ? `<div class="mb-6 rounded-xl border bg-amber-50 border-amber-200 text-amber-800 p-4 text-sm">You can browse and join plans freely. The one-time <b>${naira(FEES.shirt)}</b> t-shirt fee is only needed when you request a payout.</div>` : '')
      + waitBanner(waits(s, p, bal), bal)
      + (() => { const o = s.filter(x => codeStatus(x) === 'open'); return o.length ? `<div class="mb-6 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 p-4 text-sm"><p class="font-semibold">You have ${o.length === 1 ? 'a plan code' : o.length + ' plan codes'} ready to use</p><div class="mt-2 space-y-1.5">${o.slice(0, 5).map(x => `<div class="flex flex-wrap items-center gap-x-3 gap-y-1"><span class="font-mono font-semibold tracking-wider text-slate-900">${esc(x.code)}</span><button onclick="copyCode('${esc(x.code)}')" class="underline text-xs font-medium">Copy</button><span class="text-xs">from ${esc(planOf(x).name)} · use before the end of ${lastDay(x)}</span></div>`).join('')}${o.length > 5 ? `<p class="text-xs">and ${o.length - 5} more…</p>` : ''}</div><p class="text-xs mt-2">Tick your codes in the join window when you join a new plan (or use them all at once), or share a code with someone. Each code works once.</p>${o.length > 1 ? `<button onclick="window._useAllCodes=true;location.hash='plans';toast('Choose a plan: all ${o.length} codes will be ticked in the join window.',0,5000)" class="${btn} mt-3">Use all ${o.length} codes to join a plan</button>` : ''}</div>` : ''; })()
      + '<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8">' + stat('Wallet balance', naira(bal), '<a href="#wallet" class="text-emerald-800 font-medium">Deposit</a>') + stat('Active plans', act.length) + stat('Total contributed', naira(sum(p)), 'Confirmed savings, excluding penalties') + stat('Expected payout', naira(act.reduce((a, x) => a + (payoutOf(planOf(x)) || 0), 0)), 'Across active plans') + '</div>'
      + '<div class="grid lg:grid-cols-5 gap-6"><div class="lg:col-span-2"><h2 class="text-sm font-semibold mb-3">Active plans</h2>' + (act.length ? '<div class="space-y-3">' + act.map(x => { const pl = planOf(x), t = pl.amount * sched(x, pl).n, pc = Math.min(100, Math.round(sum(p, x.id) / t * 100) || 0); return `<a href="#mine" class="block bg-white border rounded-xl p-4 hover:border-emerald-700"><div class="flex justify-between text-sm"><span class="font-medium">${esc(pl.name)}</span><span class="text-slate-500">${pc}%</span></div>${bar(pc)}<p class="text-xs text-slate-500 mt-2">${dueLine(planState(x, pl, p), pl.frequency)}</p></a>`; }).join('') + '</div>' : `<div class="bg-white border border-dashed rounded-xl p-6 text-sm text-slate-500">You have not joined a plan yet. <a href="#plans" class="text-emerald-800 font-medium">Browse plans</a></div>`) + '</div>'
      + '<div class="lg:col-span-3"><div class="flex justify-between mb-3"><h2 class="text-sm font-semibold">Recent payments</h2><a href="#payments" class="text-sm text-emerald-800 font-medium">View all</a></div>' + table(['Date', 'Plan', 'Amount', 'Status'], p.slice(0, 5).map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), naira(x.amount), badge(x.status)])) + '</div></div>';
  },
  async wallet(m) {
    const [u, s, p, txs, deps, I] = await Promise.all([pb.collection('users').getOne(U().id), subs(), pays(), pb.collection('wallet_txs').getList(1, 60, { filter: uf(), sort: '-created' }).then(r => r.items).catch(() => []), pb.collection('deposits').getList(1, 30, { filter: uf(), sort: '-created' }).then(r => r.items).catch(() => []), transferInfo().catch(() => ({}))]);
    const bal = u.wallet_balance || 0, ws = waits(s, p, bal), need = ws.filter(i => i.w.s === 'waiting').reduce((a, i) => a + i.w.cost, 0) - bal;
    const dueNow = ws.filter(i => i.w.s !== 'done'), pre = need > 0 ? need : '';
    const chips = [1000, 3000, 5000, 10000, 20000].map(a => `<button type="button" data-a="${a}" class="px-3 py-1.5 rounded-full border bg-white text-sm font-medium text-slate-600 hover:bg-slate-100">${naira(a)}</button>`).join('');
    const open = !!I.account_number;
    m.innerHTML = head('Wallet', 'Deposit by bank transfer and upload your receipt. Your plans take their contributions from your wallet automatically.')
      + waitBanner(ws, bal)
      + (bal < 0 ? `<div class="mb-6 rounded-xl border bg-red-50 border-red-200 text-red-700 p-4 text-sm">Your wallet is <b>${naira(bal)}</b> because a deposit was reversed (the money did not reach our account). Your next deposit covers this first; plans wait until the wallet is above zero.</div>` : '')
      + `<div class="grid lg:grid-cols-5 gap-6"><div class="lg:col-span-2 space-y-6"><div class="bg-brand-950 text-white rounded-xl p-6 relative overflow-hidden" style="background-image:radial-gradient(20rem 12rem at 100% 0%,rgba(245,183,42,.25),transparent)"><p class="text-xs uppercase tracking-wide text-brand-200">Wallet balance</p><p class="text-3xl font-semibold mt-2">${naira(bal)}</p></div>`
      + (open ? `<form id="dep" class="bg-white border rounded-xl p-5 space-y-3"><h2 class="text-sm font-semibold text-slate-900">Deposit by bank transfer</h2>
          ${accountBox(I)}

  async plans(m) {

  async mine(m) {

      // payouts open only once the whole saving period has run its course (and every payment is confirmed)
      const other = runningOthers(s, x.id, planOf).length > 0, opens = payoutOpensAt(s, x.id, planOf), end = termEnd(x, pl), over = Date.now() >= end.getTime(), reqs = po.filter(o => o.subscription === x.id), done = reqs.some(o => o.status === 'confirmed'), asked = reqs.some(o => o.status === 'pending');

      return `<div class="bg-white border rounded-xl p-5"><div class="flex justify-between items-start gap-3"><h3 class="font-semibold">${esc(pl.name)}</h3>${badge(x.status)}</div><p class="text-sm text-slate-500 mt-1">${naira(pl.amount)} ${pl.frequency} · ${monthsLabel(pl)} · started ${date(x.created)}</p>${bar(pc)}<p class="text-sm mt-2">${naira(paid)} of ${naira(t)} <span class="text-slate-500">(${pc}%)</span></p><p class="text-xs text-slate-500 mt-1">${st.paid} of ${st.duration} ${FQ[pl.frequency]}s paid</p>${termLine}${x.status === 'active' ? `<p class="text-sm text-slate-500 mt-3">${ws.s === 'waiting' ? `<span class="text-red-600 font-medium">Waiting for a deposit: ${naira(ws.cost)} needed, add at least ${naira(ws.short)} to your wallet</span>` : ws.s === 'scheduled' ? `Next payment of <b class="font-medium text-slate-700">${naira(st.cost(0))}</b> is taken from your wallet on <b class="font-medium text-slate-700">${fmtDay(ws.at)}</b> (due ${fmtDue(pl.frequency, st.next)})` : dueLine(st, pl.frequency)}</p>` : ''}<div class="flex flex-wrap gap-2 mt-4">${ws.s === 'waiting' ? `<button onclick="depositBox(${ws.short})" class="${btn}">Deposit ${naira(ws.short)}</button>` : ''}${payAct}</div>${x.joined_code ? `<p class="text-xs text-slate-500 mt-3">Joined with plan code <span class="font-mono">${esc(x.joined_code)}</span></p>` : ''}${codePanel(x)}</div>`;

  },
  async payments(m) {

  async rules(m) { m.innerHTML = head('Rules and fees', 'Wallet, fees, plan codes, due dates, late penalties and payouts. These are part of the <a href="terms.html" target="_blank" class="text-emerald-800 underline">Terms and Conditions</a>.') + rulesHTML(); },
  async profile(m) {
    const u = await pb.collection('users').getOne(U().id), ready = payoutReady(u);
    const sec = (t, d, body) => `<section class="bg-white border rounded-xl p-5 sm:p-6"><h2 class="font-semibold text-slate-900">${t}</h2><p class="text-sm text-slate-500 mt-0.5 mb-4">${d}</p><div class="grid sm:grid-cols-2 gap-3">${body}</div></section>`;
    m.innerHTML = head('Profile', 'Your details and the account your payouts are sent to. You can change them at any time.')
      + (ready ? '' : `<div class="mb-6 rounded-xl border bg-amber-50 border-amber-200 text-amber-800 p-4 text-sm">Add your <b>payout details</b> below. They are needed before you can request a payout, and the admin uses them to pay you.</div>`)
      + `<form id="pf2" class="space-y-6 max-w-3xl">`
      + sec('Personal details', 'How we know and reach you.', fld('Full name', 'name', u.name, 'text', 'required') + fld('Phone', 'phone', u.phone, 'tel') + fld('Country', 'country', u.country) + `<label class="block text-sm sm:col-span-2"><span class="text-slate-600">Home address</span><textarea name="address" rows="2" required placeholder="House number, street, area, city" class="${inp} mt-1">${esc(u.address || '')}</textarea></label>`)
      + sec('Payout details', 'The bank account your payouts are paid into. Use an account in your own name.',
          fld('Account name', 'bank_account_name', u.bank_account_name || u.name, 'text', 'required placeholder="As it appears on your bank account"')

          + fld('Account number', 'bank_account_number', u.bank_account_number, 'text', 'required inputmode="numeric" pattern="[0-9]{10}" placeholder="10 digits" title="Your 10-digit account number"'))
      + `<div class="flex flex-wrap items-center gap-3"><button class="${btn}">Save changes</button><span id="psv" class="text-sm text-slate-500"></span></div></form>`;
    const f = $('#pf2'), an = f.querySelector('[name="bank_account_number"]');

      e.preventDefault(); const b = f.querySelector('button'); b.disabled = true;
      try { await pb.collection('users').update(u.id, Object.fromEntries(new FormData(f))); await pb.collection('users').authRefresh().catch(() => { }); toast('Profile saved'); $('#psv').textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); refresh(); }
      catch (x) { toast(Object.values(x.response?.data || {}).map(v => v.message).join(' ') || x.message, 1, 6000); }

}, support: true,
// counters beside the menu: receipts being checked or turned down, new plans, plan codes ready to use, payout decisions
badges: async () => {
  const id = U().id, q = (f, v) => pb.filter(f, { u: id, t: v || '' }), now = new Date().toISOString().replace('T', ' ');
  const [checking, turned, plans, codes, payouts] = await Promise.all([
    countOf('deposits', q('user={:u} && status="pending" && gateway="transfer"')),
    countOf('deposits', q('user={:u} && (status="failed" || status="reversed") && gateway="transfer" && updated>{:t}', seenAt('wallet'))),
    countOf('plans', q('active=true && created>{:t}', seenAt('plans'))),
    countOf('subscriptions', pb.filter('user={:u} && code!="" && code_used_at="" && code_admin="" && code_from<={:n} && code_until>{:n}', { u: id, n: now })),
    countOf('payouts', q('user={:u} && status!="pending" && updated>{:t}', seenAt('payouts')))]);

},
deps: { overview: ['subscriptions', 'payments', 'wallet_txs'], wallet: ['wallet_txs', 'subscriptions', 'payments', 'deposits'], plans: ['plans'], mine: ['subscriptions', 'payments', 'payouts', 'wallet_txs'], payments: ['payments', 'payouts'], fees: ['fees'], payouts: ['payouts'], rules: [], profile: [] }, chip: async () => naira(await walletBal()), live: ['plans', 'subscriptions', 'payments', 'payouts', 'fees', 'wallet_txs', 'deposits'], onLive: (c, e) => {
  if (c === 'subscriptions' && e.action === 'update' && e.record.code_used_at && Date.now() - parseTs(e.record.code_used_at).getTime() < 120000) {
    const k = 'cu:' + e.record.id; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, 1); toast('Your plan code ' + e.record.code + ' was just used by ' + (e.record.code_used_name || 'a member') + '.', 0, 8000); }
    return;
  }
  if (c === 'deposits' && e.action === 'update' && e.record.status === 'failed') { toast('Your receipt for ' + naira(e.record.total) + ' was rejected' + (e.record.check_note ? ': ' + e.record.check_note : '.'), 1, 9000); return; }
  if (c === 'deposits' && e.action === 'update' && e.record.status === 'reversed') { toast('A deposit of ' + naira(e.record.amount) + ' was reversed' + (e.record.check_note ? ': ' + e.record.check_note : '.'), 1, 9000); return; }
  // a receipt read in the background could not be confirmed (one that was credited shows the "added to your wallet" notice instead)
  if (c === 'deposits' && e.action === 'update' && e.record.status === 'pending' && e.record.verified !== 'queued' && e.record.check?.read !== undefined && e.record.gateway === 'transfer') {
    const k = 'dq:' + e.record.id; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, 1); toast('Receipt for ' + naira(e.record.total) + ': ' + (e.record.check_note || 'waiting for an admin to check it.'), 0, 9000); }
    return;
  }
  if (c === 'deposits') return;
  if (c === 'wallet_txs' && e.action === 'create') {
    const r = e.record;
    if (r.kind === 'topup') toast(naira(r.amount) + ' added to your wallet.', 0, 6000);
    else if (r.kind === 'reversal') return;
    else if (r.kind === 'contribution') toast(naira(r.amount) + ' taken from your wallet. ' + (r.note || ''), 0, 5000);
    return;
  }
  if (e.action !== 'update' || e.record.status === 'pending') return;

  if (c === 'fees') toast('Your ' + (FEE_LABEL[e.record.type] || 'fee').toLowerCase() + ' payment of ' + naira(e.record.amount) + ' was ' + e.record.status + '.', e.record.status === 'rejected');
  if (c === 'payouts') toast('Your payout request was ' + (e.record.status === 'confirmed' ? 'approved' : e.record.status) + '.', e.record.status === 'rejected');
} });

// re-check a pending deposit with the payment provider (button on the Wallet page)
window.recheck = async ref => { try { const r = await pb.send('/api/jjhhf/wallet/verify', { method: 'POST', body: { tx_ref: ref } }); toast(r.status === 'successful' ? naira(r.amount) + ' added to your wallet.' : r.status === 'failed' ? 'That payment did not go through.' + (r.note ? ' ' + r.note : '') : 'Still waiting for confirmation. Try again in a minute.', r.status === 'failed', 6000); refresh(); } catch (x) { toast(x.message, 1); } };

(async () => {
  // back from the payment page. Flutterwave: ?status&tx_ref&transaction_id · Paystack: ?trxref&reference · Monnify: ?paymentReference
  const q = new URLSearchParams(location.search), ref = q.get('tx_ref') || q.get('reference') || q.get('trxref') || q.get('paymentReference');
  if (ref) {
    history.replaceState(null, '', location.pathname + '#wallet');
    if (q.get('status') === 'cancelled') toast('Payment cancelled. Nothing was charged.', 1, 6000);

      toast('Confirming your payment…');
