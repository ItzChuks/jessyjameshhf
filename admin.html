<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="tailwind.css?v=20261109v"><script src="theme.js?v=20261109v"></script><script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.js"></script><script src="mock.js?v=20261109v"></script><script src="pdf.js?v=20261109v"></script><script src="app.js?v=20261109v"></script><title>Admin – Jessy James Helping Hands Foundation</title></head>
<body class="bg-slate-50 text-slate-800"><div id="app"></div>
<script>

 async d=>{const r=await pb.send('/api/jjhhf/wallet/credit',{method:'POST',body:{user:id,amount:+d.amount,ref:d.ref,note:d.note}});toast(naira(+d.amount)+' credited. Wallet now '+naira(r.balance)+'.',0,6000)},'Credit wallet');document.querySelector('[data-ui="modal"] [name="amount"]').focus()};
window.deductWallet=async id=>{const u=await col('users').getOne(id);modal('Deduct from '+esc(u.name||u.email)+'\'s wallet','<p class="text-sm text-slate-600">Wallet now: <b>'+naira(u.wallet_balance)+'</b>. You can deduct up to this amount.</p>'+fld('Amount (₦)','amount','','number','required min="1" step="1" max="'+Math.max(0,u.wallet_balance||0)+'"')+fld('Reason (the member sees this)','note','','text','required placeholder="e.g. Correction: credited twice"')+fld('Reference (optional)','ref')+'<div id="dedv" class="text-sm rounded-lg border bg-slate-50 p-3"></div>',
 async d=>{if(!(await confirmBox({title:'Deduct '+naira(+d.amount)+'?',message:naira(+d.amount)+' will be taken out of '+(u.name||u.email)+'\'s wallet. Reason shown to them: '+d.note,confirmText:'Deduct',danger:true})))throw new Error('Cancelled.');
  const r=await pb.send('/api/jjhhf/wallet/deduct',{method:'POST',body:{user:id,amount:+d.amount,note:d.note,ref:d.ref}});toast(naira(+d.amount)+' deducted. Wallet now '+naira(r.balance)+'.',0,6000)},'Deduct');
 const M=document.querySelector('[data-ui="modal"]'),a=M.querySelector('[name="amount"]'),p=()=>{const v=+a.value||0;$('#dedv').innerHTML=v>(u.wallet_balance||0)?'<span class="text-red-600">More than the wallet holds.</span>':'Wallet after: <b>'+naira((u.wallet_balance||0)-v)+'</b>'};a.oninput=p;p();a.focus()};
// payment partner: '' = Automatic (balanced random draw by the server), or a provider chosen by hand

window.shuffleGw=async all=>{

window.suspendUser=async(id,on)=>{const u=await col('users').getOne(id);
 if(on==='1'){const reason=await askText('Suspend '+(u.name||u.email)+'?','They are signed out and cannot sign in or use the site until you restore the account. Their plans keep running. They see the reason when they try to sign in.','Reason','Breaking the site rules');if(reason===null)return;
  try{await pb.send('/api/jjhhf/admin/suspend',{method:'POST',body:{user:id,suspended:true,reason}});toast('Account suspended');refresh()}catch(e){toast(e.message,1)}}
 else{if(!(await confirmBox({title:'Restore '+(u.name||u.email)+'?',message:'They can sign in and use the site again.',confirmText:'Restore account'})))return;
  try{await pb.send('/api/jjhhf/admin/suspend',{method:'POST',body:{user:id,suspended:false}});toast('Account restored');refresh()}catch(e){toast(e.message,1)}}};
// what a plan started "days" ago with "paid" already paid means: start date, payments recorded, next payment, payments due but unpaid
// (pen: charge the late penalty on those). Used by Add existing plans and Edit plan.
const planPreview=(pl,days,paid,pen)=>{const L=new Date(Date.now()+36e5),start=new Date(Date.UTC(L.getUTCFullYear(),L.getUTCMonth(),L.getUTCDate()-days,8)-36e5),sub={created:start.toISOString()},S=sched(sub,pl),now=new Date();
  const endToday=new Date(Date.UTC(L.getUTCFullYear(),L.getUTCMonth(),L.getUTCDate(),23,59)-36e5);let due=0;while(due<S.n&&S.due(due)<=endToday)due++;
  const k=paid/pl.amount,ok=paid>=0&&Number.isInteger(k)&&k<=S.n;if(!ok)return{ok,late:0,txt:'<span class="text-red-600">Amount paid must be a multiple of '+naira(pl.amount)+', up to '+naira(pl.amount*S.n)+' ('+S.n+' payments).</span>'};
  let late=0;while(late<S.n-k&&S.due(k+late)<=now)late++;const owed=Math.max(0,due-k);
  return{ok,late,owed,txt:'Started '+fmtDay(start)+' (day '+(days+1)+') · <b>'+k+' of '+S.n+'</b> paid · '+(owed?'<span class="text-amber-800">'+owed+' due and unpaid'+(late?(pen?', '+late+' late (double)':', no penalty'):'')+'</span>':k>=S.n?'fully paid, payouts open '+fmtDay(termEnd(sub,pl)):'next payment '+fmtDay(collectAt(sub,pl,k)))}};

 if(!u.suspended)return toast('Suspend the account first; only suspended accounts can be reset.',1,6000);

 const L=[['subscriptions','plans (with their plan codes)'],['payments','payments'],['payouts','payout requests'],['fees','fees'],['wallet_txs','wallet history lines'],['deposits','deposits and receipt files']];
 modal('Reset '+esc(u.name||u.email)+'\'s account?','<div class="rounded-lg border bg-amber-50 border-amber-200 text-amber-900 p-3 text-sm"><b>This cannot be undone.</b> All activity below is cleared and the wallet is set to ₦0 (now <b>'+naira(u.wallet_balance)+'</b>).</div>'

  +'<div class="rounded-lg border p-3 text-sm"><p class="font-medium text-slate-900">Kept</p><p class="text-slate-600 mt-0.5">Name, email, phone, country, address and payout bank details. The account stays suspended until you click Restore account.</p></div>'

  +'<label class="block text-sm"><span class="text-slate-600">Type <b>RESET</b> to confirm</span><input name="confirm" autocomplete="off" required class="'+inp+' mt-1 font-mono"></label>',
  async d=>{if((d.confirm||'').trim()!=='RESET')throw new Error('Type RESET (in capitals) to confirm.');
   const r=await pb.send('/api/jjhhf/admin/reset-user',{method:'POST',body:{user:id,confirm:'RESET',clear_shirt:!!d.clear_shirt}});
   const n=Object.values(r.removed||{}).reduce((a,b)=>a+b,0);toast((r.name||'Account')+' was reset: '+n.toLocaleString()+' records cleared. The account is still suspended.',0,8000)},'Reset account');
 const M=document.querySelector('[data-ui="modal"]'),b=M.querySelector('button:not([type])');b.className=b.className.replace(/bg-emerald-\d+|hover:\S+/g,'')+' bg-red-600 hover:bg-red-700 text-white';M.querySelector('[name="confirm"]').focus()};
// ===== permanently delete a suspended member and all their records =====
window.deleteUser=async id=>{const u=await col('users').getOne(id);
 if(!u.suspended)return toast('Suspend the account first; only suspended accounts can be deleted.',1,6000);
 let c={};try{c=await pb.send('/api/jjhhf/admin/delete-user?user='+encodeURIComponent(id),{method:'GET'})}catch(e){return toast(e.message,1)}
 const L=[['subscriptions','plans (with their plan codes)'],['payments','payments'],['payouts','payout requests'],['fees','fees'],['wallet_txs','wallet history lines'],['deposits','deposits and receipt files']];
 modal('Delete '+esc(u.name||u.email)+' permanently?','<div class="rounded-lg border bg-red-50 border-red-200 text-red-700 p-3 text-sm"><b>This cannot be undone.</b> The account, profile and bank details, and every record below are wiped from the database. Wallet balance lost: <b>'+naira(u.wallet_balance)+'</b>.</div>'
  +'<ul class="text-sm divide-y border rounded-lg">'+L.map(x=>'<li class="flex justify-between px-3 py-1.5"><span class="text-slate-600">'+x[1]+'</span><b>'+(c[x[0]]||0).toLocaleString()+'</b></li>').join('')+'</ul>'
  +'<p class="text-xs text-slate-500">Members who used one of their plan codes keep their plans; the code will show "used by Deleted member".</p>'
  +'<label class="block text-sm"><span class="text-slate-600">Type <b>DELETE</b> to confirm</span><input name="confirm" autocomplete="off" required class="'+inp+' mt-1 font-mono"></label>',
  async d=>{if((d.confirm||'').trim()!=='DELETE')throw new Error('Type DELETE (in capitals) to confirm.');
   const r=await pb.send('/api/jjhhf/admin/delete-user',{method:'POST',body:{user:id,confirm:'DELETE'}});
   toast((r.name||'Member')+' and all their records were deleted.',0,7000);location.hash='users'},'Delete permanently');
 const M=document.querySelector('[data-ui="modal"]'),b=M.querySelector('button:not([type])');b.className=b.className.replace(/bg-emerald-\d+|bg-brand-\d+|hover:bg-\S+/g,'')+' bg-red-600 hover:bg-red-700 text-white';M.querySelector('[name="confirm"]').focus()};
// ===== add a plan a member was running manually =====
// The admin picks the plan, how long it has been running and how much was paid. The plan is dated back to its real start, the paid
// amount is recorded (no joining fee, wallet untouched), and from then on it carries on automatically like any other plan.
window.importPlan=async uid=>{const [u,plans]=await Promise.all([col('users').getOne(uid),col('plans').getFullList({sort:'category,frequency,amount'})]);
 if(!plans.length)return toast('Create a plan first (Plans > Add plan).',1);
 const P=Object.fromEntries(plans.map(p=>[p.id,p]));
 const opts=plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+naira(p.amount)+' '+p.frequency+(p.active?'':' (hidden)')+'</option>').join('');
 const rowHTML=()=>'<div data-row class="rounded-lg border p-3"><div class="flex items-center gap-2"><select data-f="plan" class="'+inp+'">'+opts+'</select><button type="button" data-del title="Remove this row" class="w-10 h-10 shrink-0 rounded-lg border bg-white text-slate-500 hover:bg-slate-100">✕</button></div>'
  +'<div class="grid grid-cols-2 gap-2 mt-2 text-sm"><label class="block col-span-2"><span class="text-slate-600">Running for</span><div class="flex gap-1 mt-1"><input data-f="n" type="number" min="0" step="1" value="0" class="'+inp+'"><select data-f="unit" class="'+inp+'"><option value="7">weeks</option><option value="1">days</option></select></div></label>'
  +'<label class="block"><span class="text-slate-600">Amount paid (₦)</span><input data-f="paid" type="number" min="0" step="1" value="0" class="'+inp+' mt-1"></label><label class="block"><span class="text-slate-600">How many times</span><input data-f="count" type="number" min="1" max="50" step="1" value="1" class="'+inp+' mt-1"></label>'
  +'<label class="block col-span-2"><span class="text-slate-600">Joined with plan code <span class="text-slate-400">(optional)</span></span><input data-f="ucode" autocomplete="off" placeholder="JJ-XXXX-XXXX" class="'+inp+' mt-1 font-mono uppercase tracking-wider"><span data-uc class="block text-xs text-slate-500 mt-1">If the member joined using someone\'s plan code, enter it: it is marked as used by this member, and How many times is set to the number of plans it carries.</span></label></div><p data-pv class="text-xs mt-2"></p></div>';
 modal('Add existing plans for '+esc(u.name||u.email),'<p class="text-sm text-slate-600">For members who were saving with you before the website. Add one row per plan; use <b>How many times</b> when they hold the same plan several times with the same progress. Each plan continues automatically from where it is.</p>'
  +'<div id="iprows" class="flex flex-col gap-3">'+rowHTML()+'</div><button type="button" id="ipadd" class="'+btn2+' w-full">+ Add another plan</button>'
  +'<label class="block text-sm"><span class="text-slate-600">Note (optional, saved on every plan added)</span><input name="note" placeholder="e.g. From the paper ledger" class="'+inp+' mt-1"></label>'
  +'<label class="flex items-start gap-2 text-sm rounded-lg border p-3 cursor-pointer"><input type="checkbox" name="charge_join_fee" id="ipfee" class="w-4 h-4 mt-0.5 rounded accent-emerald-700"><span><b>Take the '+naira(FEES.join)+' joining fee</b> for each plan from the wallet<span class="block text-xs text-slate-500">Wallet now: '+naira(u.wallet_balance)+'. The weekly payments are then taken from the wallet automatically as usual. Unticked: no joining fee.</span></span></label>'
  +'<label class="flex items-start gap-2 text-sm rounded-lg border p-3 cursor-pointer"><input type="checkbox" name="charge_penalty" id="ippen" class="w-4 h-4 mt-0.5 rounded accent-emerald-700"><span><b>Charge late penalty</b> on payments that are already overdue<span class="block text-xs text-slate-500">Unticked: overdue payments are collected at the normal amount. Payments that fall due from now on follow the usual late rules either way.</span></span></label>'
  +(()=>{const L=new Date(Date.now()+36e5),ymd=k=>new Date(Date.UTC(L.getUTCFullYear(),L.getUTCMonth(),L.getUTCDate()+k)).toISOString().slice(0,10);
    return '<fieldset class="rounded-lg border p-3 text-sm"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="code_on" id="ipcode" checked class="w-4 h-4 rounded accent-emerald-700"><b>Give each plan a plan code</b></label>'
     +'<div id="ipcd" class="grid grid-cols-2 gap-2 mt-2"><label class="block"><span class="text-slate-600">Usable from</span><input name="code_from" type="date" value="'+ymd(0)+'" min="'+ymd(0)+'" class="'+inp+' mt-1"></label><label class="block"><span class="text-slate-600">Expires after</span><input name="code_until" type="date" value="'+ymd(3)+'" min="'+ymd(0)+'" class="'+inp+' mt-1"></label></div>'

  +'<div id="ipv" class="text-sm rounded-lg border bg-slate-50 p-3"></div>',
  async d=>{if(d.code_on&&(!d.code_from||!d.code_until||d.code_until<d.code_from))throw new Error('Choose when the plan codes open and expire (the last day must be on or after the first).');

   const r=await pb.send('/api/jjhhf/admin/import-plan',{method:'POST',body:{user:uid,note:d.note,charge_penalty:!!d.charge_penalty,charge_join_fee:!!d.charge_join_fee,code_mode:d.code_on?'custom':'none',code_from:d.code_from,code_until:d.code_until,items:rows.map(r=>({plan:r.pl.id,days:r.days,amount_paid:r.paid,count:r.count,use_code:r.ucode}))}});
   toast(r.added+' plan'+(r.added===1?'':'s')+' added for '+(u.name||u.email)+'.'+(d.charge_join_fee?' Joining fees taken from the wallet.':'')+(r.collected?' '+r.collected+' payment'+(r.collected===1?' was':'s were')+' due and taken from the wallet.':''),0,7000)},'Add plans');
 const M=document.querySelector('[data-ui="modal"]');M.querySelector('form').classList.replace('max-w-md','max-w-2xl');
 // what a row means: start date, payments recorded, next payment, and any payments already due but not paid

 const read=()=>[...M.querySelectorAll('[data-row]')].map(el=>{const g=f=>el.querySelector('[data-f="'+f+'"]'),pl=P[g('plan').value],days=(+g('n').value||0)*(+g('unit').value||7),paid=+g('paid').value||0,ucode=g('ucode').value.trim(),uc=+el.dataset.ucount||0;
  if(ucode&&uc){g('count').value=uc;g('count').readOnly=true}else g('count').readOnly=false;

 const paint=()=>{const rows=read();let n=0,amt=0,owed=0,late=0,bad=0;
