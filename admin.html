     <div>${ab('Credit wallet',call('creditWallet',u.id),'bg-emerald-600 text-white')}${regBtn(u)}${ab(u.role==='admin'?'Make user':'Make admin',call('setRec','users',u.id,'role',u.role==='admin'?'user':'admin'))}</div></div>
    <div class="grid sm:grid-cols-2 sm:gap-x-10 mt-4 border-t">
     <dl class="divide-y">${kv('Phone',u.phone?`<a href="tel:${esc(u.phone)}" class="text-emerald-800 hover:underline">${esc(u.phone)}</a>`:'')}${kv('Country',esc(u.country))}${kv('Email',esc(u.email))}${kv('Address',esc(u.address))}</dl>
     <dl class="divide-y border-t sm:border-t-0">${kv('Role',u.role==='admin'?'Administrator':'Member')}${kv('Registration',u.role==='admin'?'':regBadge(u)+(u.shirt_paid&&u.shirt_paid_at?' <span class="text-xs font-normal text-slate-500">since '+date(u.shirt_paid_at)+'</span>':''))}${kv('Joined',date(u.created))}${kv('Account ID',esc(u.id))}</dl></div></div>
   <div class="bg-white border rounded-xl p-5 sm:p-6 mb-6"><div class="flex flex-wrap items-center justify-between gap-2 mb-2"><h2 class="font-semibold text-slate-900">Payout details</h2>${payoutReady(u)?'<span class="text-xs text-slate-500">From the member\'s profile</span>':''}</div>${payoutDetails(u)}${o.some(x=>x.status==='pending')?'<p class="mt-3 text-sm text-amber-800 font-medium">This member has a payout request waiting. <a href="#payouts" class="underline">Go to payouts</a></p>':''}</div>
   <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8">${stat('Plans joined',s.length)}${stat('Confirmed savings',naira(saved),'Excluding penalties')}${stat('Penalties paid',naira(pen),'From late payments')}${stat('Wallet balance',naira(u.wallet_balance),'Deposits via Flutterwave')}</div>
   <h2 class="text-sm font-semibold mb-3">Plans</h2>${table(['Plan','Contribution','Progress','Plan code','Status','Started',''],s.map(x=>{const pl=x.expand?.plan||{},t=(pl.amount||0)*(pl.frequency?sched(x,pl).n:0),v=saves(x.id);return[esc(pl.name),naira(pl.amount)+' '+(pl.frequency||''),`${naira(v)} of ${naira(t)} (${Math.min(100,Math.round(v/t*100))||0}%)`,x.code?'<span class="font-mono text-xs">'+esc(x.code)+'</span> '+codeBadge(x)+(x.code_used_at?'<span class="block text-xs text-slate-500">by '+esc(x.code_used_name)+'</span>':''):'—',badge(x.status),date(x.created),x.status==='active'?ab('Complete',call('setRec','subscriptions',x.id,'status','completed'))+ab('Cancel',call('setRec','subscriptions',x.id,'status','cancelled'),'border text-red-600'):'']}))}
   <h2 class="text-sm font-semibold mt-8 mb-3">Wallet history</h2>${table(['Date','Type','Details','Amount','Balance'],wt.map(x=>[date(x.created),WK[x.kind]||x.kind,'<span class="text-xs text-slate-500">'+esc(x.note||'')+'</span>',(x.type==='credit'?'+':'−')+naira(x.amount),naira(x.balance)]))}
   <h2 class="text-sm font-semibold mt-8 mb-3">Transaction history</h2><div id="th"></div>`;
  txHistory($('#th'),{key:'user:'+id,cust:u,extra:act,txs:[...p.map(x=>txFrom(x,'payment')),...o.map(x=>txFrom(x,'payout'))].sort((a,b)=>b.at-a.at)})},
 async plans(m){const l=await col('plans').getFullList({sort:'category,frequency,amount'});window._pln=Object.fromEntries(l.map(p=>[p.id,p]));window._sel=window._sel||new Set();
[...window._sel].forEach(id=>{if(!window._pln[id])window._sel.delete(id)});
  m.innerHTML=head('Plans','Grocery plans of 4, 8, 12 or 25 weeks (or your own length), with the day each plan code opens and expires. Tick plans to delete several at once.',(l.length?'':'<button onclick="seed()" class="'+btn2+'">Add starter plans</button>')+'<button onclick="planForm()" class="'+btn+'">Add plan</button>')+'<div id="bk" class="mb-3"></div><div id="ex"></div><div id="bkf"></div>';
  explorer($('#ex'),l,{onPaint:()=>bulk(),cols:{heads:['SEL','Name','Contributions','Amount','Length','Payments','Payout','Code usable','Status',''],row:(p,i)=>['<input type="checkbox" data-sel="'+p.id+'" '+(window._sel.has(p.id)?'checked ':'')+'onchange="togSel(\''+p.id+'\',this.checked)" class="w-4 h-4 rounded accent-emerald-700" aria-label="Select '+esc(p.name)+'">','<button onclick="openPlan('+i+')" class="font-medium text-emerald-800 hover:underline">'+esc(p.name)+'</button>'+(p.category!=='grocery'?' <span class="text-xs text-slate-400">('+p.category+', retired)</span>':''),p.frequency,naira(p.amount),monthsLabel(p),nPay(p),naira(payoutOf(p)),codeDays(p)?'Day '+p.code_from_day+'–'+p.code_until_day:'<span class="text-amber-800">Not set</span>',badge(p.active?'active':'cancelled').replace('Cancelled','Hidden'),ab('Edit','planForm(\''+p.id+'\')')+ab('Delete',call('delPlans',p.id),'border text-red-600')]}});},
 async subs(m){const q=window._sq||'all';
  m.innerHTML=head('Contributions','All member subscriptions to plans.')+'<div class="flex flex-wrap gap-1.5 mb-4">'+[['all','All'],['active','Active'],['completed','Completed'],['cancelled','Cancelled']].map(t=>'<button onclick="window._sq=\''+t[0]+'\';window._pg={};refresh()" class="px-3 py-1.5 rounded-full text-sm font-medium border '+(t[0]===q?'bg-emerald-800 text-white border-emerald-800':'bg-white text-slate-600 hover:bg-slate-100')+'">'+t[1]+'</button>').join('')+'</div><div id="sl"></div>';
  await pagedTable($('#sl'),{col:'subscriptions',key:'subs',expand:'user,plan',filter:q==='all'?'':'status="'+q+'"',heads:['User','Plan','Progress','Status','Started',''],row:s=>[ulink(s.expand?.user),esc(s.expand?.plan?.name),(s.paid_count||0).toLocaleString()+' paid',badge(s.status),date(s.created),s.status==='active'?ab('Complete','setRec(\'subscriptions\',\''+s.id+'\',\'status\',\'completed\')')+ab('Cancel','setRec(\'subscriptions\',\''+s.id+'\',\'status\',\'cancelled\')','border text-red-600'):'']})},
 async wallet(m){const S=await stats(),k=window._wk||'all';
  m.innerHTML=head('Wallet','Every deposit, fee and contribution across all member wallets.')+'<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 mb-8">'+stat('Held in wallets',naira(S.held),'Members\' unspent balances')+stat('Flutterwave deposits',naira(S.depositTotal),S.deposits.toLocaleString()+' successful')+stat('All money in',naira(S.topupTotal),S.topups.toLocaleString()+' credits (deposits + manual)')+'</div>'
   +'<div class="flex flex-wrap gap-1.5 mb-4">'+[['all','All'],...Object.entries(WK)].map(t=>'<button onclick="window._wk=\''+t[0]+'\';window._pg={};refresh()" class="px-3 py-1.5 rounded-full text-sm font-medium border '+(t[0]===k?'bg-emerald-800 text-white border-emerald-800':'bg-white text-slate-600 hover:bg-slate-100')+'">'+t[1]+'</button>').join('')+'</div><div id="wl"></div>';
  await pagedTable($('#wl'),{col:'wallet_txs',key:'wallet',expand:'user',filter:k==='all'?'':'kind="'+k+'"',heads:['Date','Member','Type','Details','Amount','Balance'],row:x=>[date(x.created),ulink(x.expand?.user),WK[x.kind]||x.kind,'<span class="text-xs text-slate-500">'+esc(x.note||'')+'</span>','<span class="'+(x.type==='credit'?'text-emerald-800':'')+' font-medium">'+(x.type==='credit'?'+':'−')+naira(x.amount)+'</span>',naira(x.balance)]})},
 async fees(m){const S=await stats();
  m.innerHTML=head('Fees',`Joining, t-shirt and payout clearance fees (${naira(S.fees)}) and tax charges on deposits (${naira(S.tax)}).`)+'<div id="fl"></div>';
  await pagedTable($('#fl'),{col:'fees',key:'fees',expand:'user,plan',heads:['Date','Member','Fee','Plan','Amount','Note','Status'],row:x=>[date(x.created),ulink(x.expand?.user),FEE_LABEL[x.type]||x.type,esc(x.expand?.plan?.name||'—'),naira(x.amount),/^REVIEW/.test(x.note)?esc(x.note):'—',badge(x.status)]})},
 async payouts(m){const q=window._oq||'pending';
  m.innerHTML=head('Payout requests','Pay each request into the bank account on the member\'s profile, then mark it as paid. Open a member\'s profile to see their full details.')+'<div class="flex flex-wrap gap-1.5 mb-4">'+[['pending','Waiting'],['confirmed','Paid'],['rejected','Rejected'],['all','All']].map(t=>'<button onclick="window._oq=\''+t[0]+'\';window._pg={};refresh()" class="px-3 py-1.5 rounded-full text-sm font-medium border '+(t[0]===q?'bg-emerald-800 text-white border-emerald-800':'bg-white text-slate-600 hover:bg-slate-100')+'">'+t[1]+'</button>').join('')+'</div><div id="ol"></div>';
  await pagedTable($('#ol'),{col:'payouts',key:'payouts',expand:'user,subscription.plan',filter:q==='all'?'':'status="'+q+'"',sort:q==='pending'?'created':'-created',heads:['Date','Member','Plan','Pay to','Status',''],row:p=>{const u=p.expand?.user||{};return[date(p.created),ulink(u),esc(p.expand?.subscription?.expand?.plan?.name),payoutReady(u)?'<div class="leading-snug"><b class="font-medium text-slate-900">'+esc(u.bank_account_name)+'</b><span class="block text-xs text-slate-500">'+esc(u.bank_name)+' · <span class="font-mono">'+esc(u.bank_account_number)+'</span></span></div>':'<span class="text-amber-800 text-xs">No details on profile</span>',badge(p.status),ab('View profile',`location.hash='user?id=${u.id}'`,'border font-medium')+(p.status==='pending'?ab('Mark paid','setRec(\'payouts\',\''+p.id+'\',\'status\',\'confirmed\')','bg-emerald-600 text-white')+ab('Reject','setRec(\'payouts\',\''+p.id+'\',\'status\',\'rejected\')','border text-red-600'):'')]}})},
 async payments(m){
  m.innerHTML=head('Payments','Contributions are taken from member wallets automatically. Filter by date and download invoices or a statement as PDF.')+'<div id="th"></div>';
  // filters run on the server: only the page being looked at is downloaded
  const remote=async(F,page,per)=>{const f=[];
   if(F.from)f.push('created>="'+dayStartTs(F.from)+'"');if(F.to)f.push('created<"'+dayStartTs(addDays(F.to,1))+'"');
   if(F.status!=='all')f.push('status="'+F.status+'"');
   if(F.q.trim())f.push(pb.filter('(note~{:q} || tx_ref~{:q} || user.name~{:q} || user.email~{:q} || subscription.plan.name~{:q})',{q:F.q.trim()}));
   const r=await col('payments').getList(page,per,{filter:f.join(' && '),expand:'user,subscription.plan',sort:'-created'});
   return{txs:r.items.map(x=>txFrom(x,'payment')),total:r.totalItems}};
  txHistory($('#th'),{key:'admin-pay',showUser:true,kinds:['payment'],extra:act,remote})}
}});}
</script></body></html>
